<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro universo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05040c;
    --deep: #0a0e2a;
    --nebula1: #6a2f8c;
    --nebula2: #2f5a8c;
    --nebula3: #8c2f5e;
    --star: #f7f2ff;
    --gold: #e8c98a;
    --pink: #f0aec2;
    --lav: #c6b8f0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: radial-gradient(ellipse at 20% 15%, #1a1240 0%, transparent 45%),
                radial-gradient(ellipse at 85% 75%, #3a1435 0%, transparent 50%),
                radial-gradient(ellipse at 60% 100%, #0d1a3d 0%, transparent 55%),
                linear-gradient(180deg, var(--void), #0a0818 55%, #050208);
    overflow-x:hidden;
    font-family:'Quicksand', sans-serif;
    color: var(--star);
  }
  #stars{ position:fixed; inset:0; z-index:0; display:block; }

  .nebula{
    position:fixed; border-radius:50%;
    filter: blur(70px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
    mix-blend-mode: screen;
  }
  .n1{ width:520px; height:520px; background:var(--nebula1); top:-10%; left:-10%; }
  .n2{ width:460px; height:460px; background:var(--nebula2); bottom:-8%; right:-8%; }
  .n3{ width:380px; height:380px; background:var(--nebula3); top:40%; left:60%; }

  header{
    position:relative; z-index:3;
    text-align:center;
    padding: 90px 20px 30px;
  }
  header .eyebrow{
    letter-spacing:5px; font-size:12px; text-transform:uppercase;
    color: var(--lav); opacity:0.75;
  }
  header h1{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight:500;
    font-size: clamp(34px, 7vw, 58px);
    margin-top:14px;
    background: linear-gradient(90deg, var(--pink), var(--gold), var(--lav));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 40px rgba(230,190,240,0.25);
  }
  header p{
    margin-top:14px;
    color: rgba(247,242,255,0.65);
    font-size:15px;
    max-width:420px;
    margin-left:auto; margin-right:auto;
    line-height:1.6;
  }

  #cosmos{
    position:relative;
    z-index:2;
    height: 200vh;
    width:100%;
  }

  .planet{
    position:absolute;
    width: 150px; height:150px;
    border-radius:50%;
    animation: float 14s ease-in-out infinite;
    z-index:2;
  }
  .planet .ring{
    position:absolute; inset:-10px;
    border-radius:50%;
    border: 1px solid var(--ring-color, rgba(240,174,194,0.5));
    opacity:0.55;
  }
  .planet .glow{
    position:absolute; inset:-22px;
    border-radius:50%;
    background: radial-gradient(circle, var(--ring-color, #f0aec2) 0%, transparent 68%);
    opacity:0.35;
    filter: blur(6px);
  }
  .planet img{
    position:relative;
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 30px var(--ring-color, rgba(240,174,194,0.6)), 0 8px 30px rgba(0,0,0,0.6);
    display:block;
  }
  .planet .cap{
    position:absolute; left:50%; bottom:-30px; transform:translateX(-50%);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:16px;
    white-space:nowrap;
    color: var(--star);
    opacity:0.8;
    text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  @keyframes float{
    0%{ transform: translate(0,0) rotate(0deg); }
    25%{ transform: translate(14px,-22px) rotate(2deg); }
    50%{ transform: translate(-8px,-6px) rotate(-1deg); }
    75%{ transform: translate(-18px,14px) rotate(1.5deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }

  .msg-layer{ position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .floating-msg{
    position:absolute;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    white-space:nowrap;
    text-shadow: 0 0 14px currentColor, 0 0 2px rgba(0,0,0,0.6);
    opacity:0;
    will-change: transform, opacity;
  }

  footer{
    position:relative; z-index:3;
    text-align:center;
    padding: 40px 20px 80px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color: rgba(247,242,255,0.35);
  }

  @media (max-width:640px){
    .planet{ width:112px; height:112px; }
  }

  @media (prefers-reduced-motion: reduce){
    .planet{ animation:none; }
    .floating-msg{ animation:none !important; opacity:0.85 !important; }
  }
</style>
</head>
<body>

<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>
<div class="msg-layer" id="msgLayer"></div>

<header>
  <div class="eyebrow">un pequeño universo</div>

<footer>hecho con cariño, para ti</footer>

<script>
  // ---------- starfield ----------
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = document.body.scrollHeight;
    canvas.style.height = H + 'px';
    initStars();
  }
  function initStars(){
    const count = Math.floor((W*H)/9000);
    stars = [];
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.3 + 0.3,
        baseAlpha: Math.random()*0.6 + 0.3,
        phase: Math.random()*Math.PI*2,
        speed: Math.random()*0.015 + 0.006
      });
    }
  }
  let t = 0;
  let shooting = [];
  function spawnShootingStar(){
    shooting.push({
      x: Math.random()*W*0.6 + W*0.1,
      y: Math.random()*H*0.3,
      len: 90 + Math.random()*60,
      speed: 9 + Math.random()*5,
      angle: Math.PI/4 + (Math.random()*0.3-0.15),
      life: 0,
      maxLife: 40
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#000';
    for(const s of stars){
      s.phase += s.speed;
      const a = s.baseAlpha + Math.sin(s.phase)*0.25;
      ctx.beginPath();
      ctx.fillStyle = `rgba(247,242,255,${Math.max(0,Math.min(1,a))})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    // shooting stars
    if(Math.random() < 0.01) spawnShootingStar();
    shooting.forEach(sh=>{
      sh.life++;
      sh.x += Math.cos(sh.angle)*sh.speed;
      sh.y += Math.sin(sh.angle)*sh.speed;
      const alpha = 1 - sh.life/sh.maxLife;
      const grad = ctx.createLinearGradient(sh.x, sh.y, sh.x - Math.cos(sh.angle)*sh.len, sh.y - Math.sin(sh.angle)*sh.len);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(sh.x, sh.y);
      ctx.lineTo(sh.x - Math.cos(sh.angle)*sh.len, sh.y - Math.sin(sh.angle)*sh.len);
      ctx.stroke();
    });
    shooting = shooting.filter(sh=>sh.life < sh.maxLife);
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  draw();

  // ---------- floating sweet messages ----------
  const phrases = ["te amo","me encantas","eres mi persona favorita","eres única","te quiero mucho","mi lugar favorito eres tú","contigo todo es mejor","eres mi calma","me haces muy feliz","eres especial"];
  const colors = ["#f0aec2","#c6b8f0","#e8c98a","#8ad0e8","#f7d1e0"];
  const layer = document.getElementById('msgLayer');

  function spawnMessage(){
    const el = document.createElement('div');
    el.className = 'floating-msg';
    el.textContent = phrases[Math.floor(Math.random()*phrases.length)];
    const color = colors[Math.floor(Math.random()*colors.length)];
    el.style.color = color;
    const size = 15 + Math.random()*14;
    el.style.fontSize = size + 'px';

    const vh = window.innerHeight;
    const startY = Math.random()*vh*0.85 + vh*0.1;
    const fromLeft = Math.random() < 0.5;
    const duration = 22 + Math.random()*14; // ni rapido ni lento
    const drift = (Math.random()*80 - 40);

    el.style.top = startY + 'px';
    el.style.left = fromLeft ? '-20%' : '110%';

    layer.appendChild(el);

    const startX = fromLeft ? -300 : window.innerWidth + 300;
    const endX = fromLeft ? window.innerWidth + 300 : -300;

    el.animate([
      { transform: `translate(0px, 0px)`, opacity: 0 },
      { transform: `translate(${(endX-startX)*0.08}px, ${drift*0.3}px)`, opacity: 0.9, offset:0.12 },
      { transform: `translate(${(endX-startX)*0.85}px, ${drift*0.8}px)`, opacity: 0.9, offset:0.85 },
      { transform: `translate(${endX-startX}px, ${drift}px)`, opacity: 0 }
    ], {
      duration: duration*1000,
      easing: 'ease-in-out',
      fill: 'forwards'
    });

    setTimeout(()=> el.remove(), duration*1000 + 200);
  }

  // keep a gentle steady stream of messages
  spawnMessage();
  setInterval(()=>{
    if(document.querySelectorAll('.floating-msg').length < 5){
      spawnMessage();
    }
  }, 3200);

</script>
